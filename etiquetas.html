<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiqueta CVC para Charolas 200x80mm</title>

<style>
  :root{
    --verde:#0a7a3b;
    --verde-oscuro:#075c2d;
    --fondo:#f3f4f6;
    --linea:#d1d5db;
  }

  @page{
    size:200mm 80mm;
    margin:0;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--fondo);
    color:#000;
    font-family:Arial, Helvetica, sans-serif;
  }

  .panel{
    width:min(1100px, calc(100% - 24px));
    margin:14px auto;
    background:#fff;
    border:1px solid #ddd;
    border-radius:16px;
    padding:16px;
    box-shadow:0 14px 34px rgba(0,0,0,.08);
  }

  .panel h1{
    margin:0 0 4px;
    font-size:22px;
  }

  .panel p{
    margin:0 0 15px;
    color:#6b7280;
    font-size:13px;
    font-weight:700;
  }

  .formulario{
    display:grid;
    grid-template-columns:repeat(4, minmax(150px, 1fr));
    gap:12px;
  }

  .campo{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .campo.doble{
    grid-column:span 2;
  }

  label{
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
  }

  input,
  select{
    width:100%;
    min-height:44px;
    padding:9px 11px;
    border:1px solid var(--linea);
    border-radius:11px;
    font-size:16px;
    font-weight:800;
    background:#fff;
    outline:none;
  }

  input:focus,
  select:focus{
    border-color:var(--verde);
    box-shadow:0 0 0 3px rgba(10,122,59,.12);
  }

  #total{
    background:#edf8f1;
    border:2px solid var(--verde);
    color:var(--verde-oscuro);
    font-size:21px;
    text-align:center;
    font-weight:900;
  }

  .acciones{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
  }

  button{
    min-height:44px;
    padding:10px 18px;
    border:none;
    border-radius:11px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
  }

  .imprimir{
    color:#fff;
    background:var(--verde);
  }

  .limpiar{
    color:#fff;
    background:#111827;
  }

  .vista-previa{
    width:100%;
    padding:14px 10px 28px;
    overflow:auto;
  }

  .etiqueta{
    width:200mm;
    height:80mm;
    margin:0 auto;
    padding:6mm 8mm;
    border:2px solid #000;
    background:#fff;
    display:grid;
    grid-template-columns:68mm 1fr 58mm;
    gap:5mm;
    overflow:hidden;
  }

  .bloque-logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    height:100%;
    padding:2mm 0;
  }

  .logo{
    width:60mm;
    height:56mm;
    object-fit:contain;
    display:block;
  }

  .empresa{
    font-size:10px;
    line-height:1.05;
    font-weight:900;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.3px;
  }

  .producto{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-left:2px solid #000;
    border-right:2px solid #000;
    padding:0 4mm;
    overflow:hidden;
  }

  .producto h1{
    margin:0;
    max-width:100%;
    font-size:31px;
    line-height:.95;
    font-weight:900;
    text-transform:uppercase;
    overflow-wrap:anywhere;
  }

  .producto h1.corto{
    font-size:42px;
  }

  .producto h1.largo{
    font-size:25px;
    line-height:1;
  }

  .producto h1.muy-largo{
    font-size:21px;
    line-height:1;
  }

  .producto h2{
    margin:5mm 0 0;
    font-size:20px;
    line-height:1;
    font-weight:900;
    text-transform:uppercase;
  }

  .info{
    display:flex;
    flex-direction:column;
    justify-content:center;
    font-size:13px;
    line-height:1.25;
    font-weight:800;
    min-width:0;
  }

  .info-linea{
    margin-bottom:1.2mm;
    overflow-wrap:anywhere;
  }

  .datos-precio{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2mm;
    border-top:1px dashed #000;
    border-bottom:1px dashed #000;
    padding:2mm 0;
    margin:1.5mm 0;
  }

  .dato-precio{
    min-width:0;
  }

  .dato-precio span{
    display:block;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
  }

  .dato-precio strong{
    display:block;
    margin-top:.5mm;
    font-size:16px;
    line-height:1;
    font-weight:900;
  }

  .total-etiqueta{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:2mm;
    margin-top:1mm;
  }

  .conservacion{
    max-width:26mm;
    font-size:10px;
    line-height:1.15;
    font-weight:900;
    text-transform:uppercase;
  }

  .total-caja{
    text-align:right;
    white-space:nowrap;
  }

  .total-caja span{
    display:block;
    font-size:10px;
    font-weight:900;
  }

  .total-caja strong{
    display:block;
    font-size:23px;
    line-height:.95;
    font-weight:900;
  }

  @media(max-width:850px){
    .formulario{
      grid-template-columns:1fr 1fr;
    }

    .campo.doble{
      grid-column:span 2;
    }
  }

  @media(max-width:520px){
    .formulario{
      grid-template-columns:1fr;
    }

    .campo.doble{
      grid-column:span 1;
    }

    .acciones button{
      width:100%;
    }
  }

  @media print{
    html,
    body{
      width:200mm;
      height:80mm;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#fff;
    }

    .panel{
      display:none !important;
    }

    .vista-previa{
      width:200mm;
      height:80mm;
      margin:0;
      padding:0;
      overflow:hidden;
    }

    .etiqueta{
      margin:0;
      page-break-inside:avoid;
      page-break-after:avoid;
    }
  }
</style>
</head>

<body>

<section class="panel">
  <h1>Etiqueta para charolas de carne</h1>
  <p>Conserva el diseño original CVC y calcula automáticamente kilos × precio por kilo.</p>

  <div class="formulario">

    <div class="campo doble">
      <label for="producto">Producto</label>
      <select id="producto">
        <option value="Bistec de res">Bistec de res</option>
        <option value="Carne molida">Carne molida</option>
        <option value="Costilla de res">Costilla de res</option>
        <option value="Chuleta">Chuleta</option>
        <option value="Rib Eye">Rib Eye</option>
        <option value="Sirloin">Sirloin</option>
        <option value="Pecho">Pecho</option>
        <option value="Carne para cocido">Carne para cocido</option>
        <option value="Carne para deshebrar">Carne para deshebrar</option>
        <option value="Producto libre">Producto libre</option>
      </select>
    </div>

    <div class="campo doble" id="campoProductoLibre" style="display:none;">
      <label for="productoLibre">Nombre del producto</label>
      <input id="productoLibre" type="text" maxlength="42" placeholder="Ej. Aguayón de res">
    </div>

    <div class="campo">
      <label for="kilos">Kilos</label>
      <input id="kilos" type="number" min="0" step="0.001" inputmode="decimal" placeholder="0.000">
    </div>

    <div class="campo">
      <label for="precioKg">Precio por kilo</label>
      <input id="precioKg" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
    </div>

    <div class="campo">
      <label for="total">Total</label>
      <input id="total" type="text" value="$0.00" readonly>
    </div>

    <div class="campo">
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date">
    </div>

    <div class="campo">
      <label for="lote">Lote</label>
      <input id="lote" type="text" maxlength="25" placeholder="Ej. LOTE-01">
    </div>

    <div class="campo">
      <label for="codigo">Código</label>
      <input id="codigo" type="text" maxlength="25" placeholder="Ej. VDC-BIS-01">
    </div>

    <div class="campo doble">
      <label for="conservacion">Leyenda de conservación</label>
      <select id="conservacion">
        <option value="CONSERVAR REFRIGERADO">Conservar refrigerado</option>
        <option value="CONSERVAR CONGELADO">Conservar congelado</option>
      </select>
    </div>

  </div>

  <div class="acciones">
    <button class="imprimir" type="button" onclick="imprimirEtiqueta()">Imprimir etiqueta</button>
    <button class="limpiar" type="button" onclick="nuevaEtiqueta()">Nueva etiqueta</button>
  </div>
</section>

<div class="vista-previa">
  <div class="etiqueta">

    <div class="bloque-logo">
      <img src="logo_recortado.png" class="logo" alt="Logo Carnes y Vísceras del Centro">
      <div class="empresa">Carnes y Vísceras del Centro</div>
    </div>

    <div class="producto">
      <h1 id="vistaProducto">BISTEC DE RES</h1>
      <h2>BIG ANGUS</h2>
    </div>

    <div class="info">
      <div class="info-linea">
        <strong>FECHA:</strong>
        <span id="vistaFecha"></span>
      </div>

      <div class="info-linea">
        <strong>LOTE:</strong>
        <span id="vistaLote">—</span>
      </div>

      <div class="info-linea">
        <strong>COD:</strong>
        <span id="vistaCodigo">—</span>
      </div>

      <div class="datos-precio">
        <div class="dato-precio">
          <span>Peso neto</span>
          <strong id="vistaKilos">0.000 kg</strong>
        </div>

        <div class="dato-precio">
          <span>Precio / kg</span>
          <strong id="vistaPrecioKg">$0.00</strong>
        </div>
      </div>

      <div class="total-etiqueta">
        <div class="conservacion" id="vistaConservacion">
          CONSERVAR REFRIGERADO
        </div>

        <div class="total-caja">
          <span>TOTAL</span>
          <strong id="vistaTotal">$0.00</strong>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const precios = {
    "Bistec de res":250,
    "Carne molida":250,
    "Costilla de res":200,
    "Chuleta":250,
    "Rib Eye":410,
    "Sirloin":270,
    "Pecho":250,
    "Carne para cocido":250,
    "Carne para deshebrar":250
  };

  const producto = document.getElementById("producto");
  const productoLibre = document.getElementById("productoLibre");
  const campoProductoLibre = document.getElementById("campoProductoLibre");
  const kilos = document.getElementById("kilos");
  const precioKg = document.getElementById("precioKg");
  const total = document.getElementById("total");
  const fecha = document.getElementById("fecha");
  const lote = document.getElementById("lote");
  const codigo = document.getElementById("codigo");
  const conservacion = document.getElementById("conservacion");

  function fechaLocalISO(){
    const ahora = new Date();
    const diferencia = ahora.getTimezoneOffset() * 60000;
    return new Date(ahora.getTime() - diferencia).toISOString().slice(0,10);
  }

  function formatearFecha(valor){
    if(!valor) return "";
    const partes = valor.split("-");
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function formatearDinero(numero){
    return "$" + (Number(numero) || 0).toLocaleString("es-MX", {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
  }

  function nombreActual(){
    if(producto.value === "Producto libre"){
      return productoLibre.value.trim() || "PRODUCTO";
    }
    return producto.value;
  }

  function ajustarNombre(){
    const elemento = document.getElementById("vistaProducto");
    const texto = elemento.textContent.trim();

    elemento.classList.remove("corto", "largo", "muy-largo");

    if(texto.length <= 12){
      elemento.classList.add("corto");
    }else if(texto.length >= 24 && texto.length <= 32){
      elemento.classList.add("largo");
    }else if(texto.length > 32){
      elemento.classList.add("muy-largo");
    }
  }

  function actualizar(){
    const kg = Number(kilos.value) || 0;
    const precio = Number(precioKg.value) || 0;
    const importe = kg * precio;

    total.value = formatearDinero(importe);

    document.getElementById("vistaProducto").textContent =
      nombreActual().toUpperCase();

    document.getElementById("vistaFecha").textContent =
      formatearFecha(fecha.value);

    document.getElementById("vistaLote").textContent =
      lote.value.trim() || "—";

    document.getElementById("vistaCodigo").textContent =
      codigo.value.trim() || "—";

    document.getElementById("vistaKilos").textContent =
      kg.toFixed(3) + " kg";

    document.getElementById("vistaPrecioKg").textContent =
      formatearDinero(precio);

    document.getElementById("vistaTotal").textContent =
      formatearDinero(importe);

    document.getElementById("vistaConservacion").textContent =
      conservacion.value;

    ajustarNombre();
  }

  function cambiarProducto(){
    const libre = producto.value === "Producto libre";
    campoProductoLibre.style.display = libre ? "flex" : "none";

    if(!libre && precios[producto.value] !== undefined){
      precioKg.value = precios[producto.value].toFixed(2);
    }

    actualizar();
  }

  function imprimirEtiqueta(){
    actualizar();

    if(!(Number(kilos.value) > 0)){
      alert("Captura los kilos del producto.");
      kilos.focus();
      return;
    }

    if(!(Number(precioKg.value) > 0)){
      alert("Captura el precio por kilo.");
      precioKg.focus();
      return;
    }

    window.print();
  }

  function nuevaEtiqueta(){
    producto.value = "Bistec de res";
    productoLibre.value = "";
    kilos.value = "";
    lote.value = "";
    codigo.value = "";
    conservacion.value = "CONSERVAR REFRIGERADO";
    fecha.value = fechaLocalISO();
    cambiarProducto();
    kilos.focus();
  }

  producto.addEventListener("change", cambiarProducto);

  [
    productoLibre,
    kilos,
    precioKg,
    fecha,
    lote,
    codigo,
    conservacion
  ].forEach(campo => {
    campo.addEventListener("input", actualizar);
    campo.addEventListener("change", actualizar);
  });

  fecha.value = fechaLocalISO();
  cambiarProducto();
</script>

</body>
</html>
